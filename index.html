<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="control" data-density="balanced">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Operations Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ════════════════════════════════════════════════════════════
   TOKENS
   ════════════════════════════════════════════════════════════ */
:root{
  --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;

  /* shape (overridden per style) */
  --r-sm:5px; --r-md:7px; --r-lg:9px;
  --hair:1px;

  /* density (overridden per density) */
  --row-py:11px; --row-px:13px; --gap:10px; --sec-gap:26px;
  --fs-name:.875rem; --fs-meta:.69rem; --av:38px;

  /* accent — single interactive accent (per style) */
  --accent:#36c184;
  --accent-weak:rgba(54,193,132,.14);
  --accent-line:rgba(54,193,132,.45);

  /* semantic status */
  --ok:#36c184;
  --ok-weak:rgba(54,193,132,.13);
  --ok-line:rgba(54,193,132,.40);
}

/* ── THEME: DARK ─────────────────────────────────────────── */
:root[data-theme="dark"]{
  --bg:#0b0e14;
  --s1:#11151d;       /* base surface */
  --s2:#161b25;       /* raised */
  --s3:#1c2230;       /* inset rows */
  --border:#222a38;
  --border-2:#2e3849;
  --text:#e7eaf1;
  --text-2:#97a1b3;
  --text-3:#586273;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
/* ── THEME: LIGHT ────────────────────────────────────────── */
:root[data-theme="light"]{
  --bg:#eef0f3;
  --s1:#ffffff;
  --s2:#ffffff;
  --s3:#f5f6f8;
  --border:#e2e5ea;
  --border-2:#d2d7df;
  --text:#1a1f29;
  --text-2:#586377;
  --text-3:#8c95a6;
  --shadow:0 1px 0 rgba(16,24,40,.02), 0 10px 26px -16px rgba(16,24,40,.25);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
}

/* ════════════════════════════════════════════════════════════
   STYLE VARIANTS
   ════════════════════════════════════════════════════════════ */
/* CONTROL — crisp NOC board, signal green */
:root[data-style="control"]{
  --r-sm:5px; --r-md:7px; --r-lg:9px;
  --accent:#36c184; --accent-weak:rgba(54,193,132,.14); --accent-line:rgba(54,193,132,.45);
}
/* MINIMAL — calmer, softer corners, indigo accent */
:root[data-style="minimal"]{
  --r-sm:9px; --r-md:13px; --r-lg:18px;
  --row-py:13px; --row-px:15px; --sec-gap:30px;
  --accent:#6172f3; --accent-weak:rgba(97,114,243,.14); --accent-line:rgba(97,114,243,.45);
}
/* TERMINAL — mono, boxy, amber accent, uppercase */
:root[data-style="terminal"]{
  --r-sm:2px; --r-md:3px; --r-lg:3px;
  --font-sans:'IBM Plex Mono',ui-monospace,monospace;
  --accent:#e0a92e; --accent-weak:rgba(224,169,46,.15); --accent-line:rgba(224,169,46,.5);
  --row-py:10px;
}
:root[data-style="terminal"][data-theme="dark"]{ --bg:#080a0d; --s1:#0d1014; --s2:#11151b; --s3:#161b22; }

/* ── DENSITY ─────────────────────────────────────────────── */
:root[data-density="compact"]{
  --row-py:8px; --row-px:10px; --gap:6px; --sec-gap:20px;
  --fs-name:.82rem; --fs-meta:.66rem; --av:32px;
}

/* ════════════════════════════════════════════════════════════
   BASE
   ════════════════════════════════════════════════════════════ */
body{
  font-family:var(--font-sans);
  background:var(--bg); color:var(--text);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01";
}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.layout{display:flex;flex-direction:column;min-height:100vh}

/* ════════════════════════════════════════════════════════════
   HEADER
   ════════════════════════════════════════════════════════════ */
.hdr{
  position:sticky;top:0;z-index:50;
  background:var(--s1); border-bottom:var(--hair) solid var(--border);
  padding:0 22px; height:62px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:var(--r-sm);flex-shrink:0;
  background:var(--s3);border:var(--hair) solid var(--border-2);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.brand h1{font-size:.95rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand p{font-size:.66rem;color:var(--text-3);margin-top:1px;letter-spacing:.02em}
:root[data-style="terminal"] .brand h1{text-transform:uppercase;letter-spacing:.04em;font-size:.85rem}

.hdr-right{display:flex;align-items:center;gap:14px}
.live-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--ok-weak);border:var(--hair) solid var(--ok-line);
  color:var(--ok);padding:5px 11px;border-radius:20px;
  font-size:.64rem;font-weight:600;letter-spacing:.08em;
}
:root[data-style="terminal"] .live-pill{border-radius:2px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}

.clock{text-align:right;line-height:1.15}
.clock-time{font-family:var(--font-mono);font-size:1.18rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock-date{font-size:.64rem;color:var(--text-3);margin-top:1px}

/* control cluster */
.ctrls{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--s3);border:var(--hair) solid var(--border);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{
  border:none;background:none;cursor:pointer;font-family:inherit;
  color:var(--text-3);font-size:.7rem;font-weight:600;
  padding:5px 10px;border-radius:calc(var(--r-sm) - 2px);
  transition:color .15s,background .15s;letter-spacing:.01em;
}
.seg button:hover{color:var(--text-2)}
.seg button.on{background:var(--s1);color:var(--text);box-shadow:var(--shadow-sm)}
.icon-btn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:var(--s3);border:var(--hair) solid var(--border);border-radius:var(--r-sm);
  color:var(--text-2);cursor:pointer;transition:color .15s,border-color .15s;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-2)}

/* ════════════════════════════════════════════════════════════
   STATS BAR
   ════════════════════════════════════════════════════════════ */
.stats-bar{
  background:var(--bg);border-bottom:var(--hair) solid var(--border);
  padding:0 22px;height:44px;display:flex;align-items:center;gap:26px;overflow-x:auto;scrollbar-width:none;
}
.stats-bar::-webkit-scrollbar{display:none}
.stat{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--text-3);white-space:nowrap}
.stat b{font-family:var(--font-mono);color:var(--text);font-size:.92rem;font-weight:600}
.stat .ok-num{color:var(--ok)}
.stat-bar-mini{width:54px;height:5px;border-radius:3px;background:var(--s3);overflow:hidden;border:var(--hair) solid var(--border)}
.stat-bar-mini > i{display:block;height:100%;background:var(--ok);border-radius:3px}
.stat-sep{width:var(--hair);height:16px;background:var(--border)}

/* ════════════════════════════════════════════════════════════
   NAV
   ════════════════════════════════════════════════════════════ */
.nav{
  background:var(--s1);border-bottom:var(--hair) solid var(--border);
  padding:0 22px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.tab{
  position:relative;padding:0 15px;height:46px;background:none;border:none;
  color:var(--text-3);cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:500;
  white-space:nowrap;display:flex;align-items:center;gap:8px;
  border-bottom:2px solid transparent;transition:color .15s;
}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-badge{
  font-family:var(--font-mono);background:var(--s3);color:var(--text-3);
  padding:1px 6px;border-radius:5px;font-size:.66rem;font-weight:600;border:var(--hair) solid var(--border);
}
.tab.active .tab-badge{color:var(--text-2)}

/* ════════════════════════════════════════════════════════════
   MAIN / TOOLBAR
   ════════════════════════════════════════════════════════════ */
.main{padding:20px 22px 48px;flex:1;max-width:1480px;width:100%;margin:0 auto}
.toolbar{display:flex;gap:9px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search{
  width:100%;padding:9px 12px 9px 34px;background:var(--s1);
  border:var(--hair) solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font-size:.8rem;font-family:inherit;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-weak)}
.search::placeholder{color:var(--text-3)}
.tbtn{
  padding:9px 14px;background:var(--s1);border:var(--hair) solid var(--border);
  border-radius:var(--r-sm);color:var(--text-2);cursor:pointer;
  font-family:inherit;font-size:.75rem;font-weight:500;white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:color .15s,border-color .15s,background .15s;
}
.tbtn:hover{color:var(--text);border-color:var(--border-2)}
.tbtn.on{background:var(--ok-weak);border-color:var(--ok-line);color:var(--ok)}

/* ════════════════════════════════════════════════════════════
   SECTION DIVIDER
   ════════════════════════════════════════════════════════════ */
.sec{display:flex;align-items:center;gap:12px;margin-bottom:13px;margin-top:var(--sec-gap)}
.sec:first-child{margin-top:0}
.sec-label{
  font-family:var(--font-mono);font-size:.64rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.12em;color:var(--text-3);white-space:nowrap;
}
.sec-line{flex:1;height:var(--hair);background:var(--border)}
.sec-count{font-family:var(--font-mono);font-size:.64rem;color:var(--text-3)}

/* ════════════════════════════════════════════════════════════
   AVATAR / STATUS
   ════════════════════════════════════════════════════════════ */
.av{
  width:var(--av);height:var(--av);border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:.72rem;font-weight:600;letter-spacing:-.01em;
  background:var(--s3);color:var(--text-2);border:var(--hair) solid var(--border);
}
.av.on{color:var(--ok);border-color:var(--ok-line);background:var(--ok-weak)}

.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text-3);opacity:.4}
.sdot.on{background:var(--ok);opacity:1}

.status-tag{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);
  font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;border:var(--hair) solid var(--border);color:var(--text-3);
}
:root[data-style="terminal"] .status-tag{border-radius:2px}
.status-tag.on{color:var(--ok);border-color:var(--ok-line);background:var(--ok-weak)}

/* program code tag */
.ptag{
  font-family:var(--font-mono);font-size:.6rem;font-weight:600;letter-spacing:.05em;
  padding:2px 6px;border-radius:4px;border:var(--hair) solid var(--border-2);color:var(--text-2);
}
:root[data-style="terminal"] .ptag{border-radius:2px}

/* ════════════════════════════════════════════════════════════
   PERSON CARD (leadership / single-program)
   ════════════════════════════════════════════════════════════ */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:var(--gap)}
.pcard{
  background:var(--s1);border:var(--hair) solid var(--border);border-radius:var(--r-md);
  padding:var(--row-py) var(--row-px);display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);transition:border-color .15s,background .15s;
}
.pcard:hover{border-color:var(--border-2)}
.pcard.on{border-left:2px solid var(--ok-line)}
.pi{flex:1;min-width:0}
.pname{font-size:var(--fs-name);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prole{font-size:var(--fs-meta);color:var(--text-2);margin-top:1px}
.psched{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--text-3);margin-top:3px;font-variant-numeric:tabular-nums}
.ptags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.pcard-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}

/* ════════════════════════════════════════════════════════════
   PROGRAM SECTION
   ════════════════════════════════════════════════════════════ */
.prog-section{
  background:var(--s1);border:var(--hair) solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm);
}
.prog-hdr{padding:13px 18px;display:flex;align-items:center;gap:13px;border-bottom:var(--hair) solid var(--border);background:var(--s2)}
.prog-code{
  font-family:var(--font-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;
  padding:4px 9px;border-radius:var(--r-sm);border:var(--hair) solid var(--border-2);
  color:var(--text);background:var(--s3);flex-shrink:0;
}
.prog-meta{min-width:0}
.prog-title{font-size:.92rem;font-weight:600}
.prog-lead{font-size:.68rem;color:var(--text-3);margin-top:1px}
.prog-cov{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.cov-txt{font-family:var(--font-mono);font-size:.7rem;font-weight:600;color:var(--text-2);white-space:nowrap}
.cov-txt b{color:var(--ok)}
.cov-bar{width:72px;height:6px;border-radius:3px;background:var(--s3);overflow:hidden;border:var(--hair) solid var(--border)}
.cov-bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.prog-grid{padding:13px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:var(--gap)}

.sitem{
  background:var(--s2);border:var(--hair) solid var(--border);border-radius:var(--r-sm);
  padding:9px 12px;display:flex;align-items:center;gap:11px;transition:border-color .15s,background .15s;
}
.sitem:hover{border-color:var(--border-2)}
.sitem.on{border-left:2px solid var(--ok-line)}
.sname{font-size:var(--fs-name);font-weight:600}
.srole{font-size:var(--fs-meta);color:var(--text-2);margin-top:1px}
.ssched{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--text-3);margin-top:2px}

/* ════════════════════════════════════════════════════════════
   AFTER HOURS
   ════════════════════════════════════════════════════════════ */
.ah-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap)}
.ah-card{
  background:var(--s1);border:var(--hair) solid var(--border);border-radius:var(--r-md);
  padding:14px 16px;box-shadow:var(--shadow-sm);transition:border-color .15s;
}
.ah-card.on{border-left:2px solid var(--ok-line)}
.ah-label{font-family:var(--font-mono);font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin-bottom:11px}
.ah-inner{display:flex;align-items:center;gap:11px}

/* ════════════════════════════════════════════════════════════
   ORG CHART
   ════════════════════════════════════════════════════════════ */
.org-scroller{overflow-x:auto;padding-bottom:28px}
.org-tree{min-width:920px;padding:4px 20px}
.org-center{display:flex;justify-content:center}
.org-vline{display:flex;justify-content:center;height:26px}
.org-vline > div{width:var(--hair);background:var(--border-2)}
.org-leads-row{display:flex;justify-content:center;gap:34px;position:relative;padding:0 12px}
.org-leads-row::before{content:'';position:absolute;top:0;left:calc(50% - 245px);width:490px;height:var(--hair);background:var(--border-2)}
.org-lead-col{display:flex;flex-direction:column;align-items:center}
.org-lead-col::before{content:'';width:var(--hair);height:26px;background:var(--border-2)}

.org-node{
  background:var(--s1);border:var(--hair) solid var(--border);border-radius:var(--r-md);
  padding:12px 15px;text-align:center;min-width:158px;position:relative;
  box-shadow:var(--shadow-sm);transition:border-color .15s;
}
.org-node:hover{border-color:var(--border-2)}
.org-node.on{border-top:2px solid var(--ok-line)}
.org-node-dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--text-3);opacity:.4}
.org-node-dot.on{background:var(--ok);opacity:1}
.org-nlabel{font-family:var(--font-mono);font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);margin-bottom:4px}
.org-nname{font-size:.86rem;font-weight:600}
.org-nsched{font-family:var(--font-mono);font-size:.66rem;color:var(--text-3);margin-top:3px}
.org-ntags{display:flex;justify-content:center;gap:4px;margin-top:7px;flex-wrap:wrap}

.org-progs{display:flex;justify-content:center;gap:11px;margin-top:26px;flex-wrap:wrap;padding:0 16px}
.org-prog{
  flex:1;min-width:182px;max-width:236px;border-radius:var(--r-md);padding:13px 14px;
  background:var(--s1);border:var(--hair) solid var(--border);box-shadow:var(--shadow-sm);
}
.org-prog-name{font-family:var(--font-mono);font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.org-prog-name .ptag{margin-left:auto}
.org-row-sm{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--s2);border:var(--hair) solid var(--border);border-radius:var(--r-sm);margin-bottom:5px}
.org-row-sm:last-child{margin-bottom:0}
.org-mini-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--text-3);opacity:.4}
.org-mini-dot.on{background:var(--ok);opacity:1}
.org-mini-name{font-size:.76rem;font-weight:600}
.org-mini-sched{font-family:var(--font-mono);font-size:.62rem;color:var(--text-3)}
.org-supp-sep{font-family:var(--font-mono);font-size:.56rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:9px 0 5px;padding-left:2px}

.org-ah-row,.org-ds-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding:0 16px}
.org-ds-row{margin-top:11px}
.org-ah-item{
  background:var(--s1);border:var(--hair) solid var(--border);border-radius:var(--r-md);
  padding:12px 16px;min-width:190px;display:flex;align-items:center;gap:12px;flex:1;max-width:256px;box-shadow:var(--shadow-sm);
}
.org-ah-item.on{border-left:2px solid var(--ok-line)}
.org-ah-label{font-family:var(--font-mono);font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:2px}
.org-ah-name{font-weight:600;font-size:.85rem}
.org-ah-sched{font-family:var(--font-mono);font-size:.66rem;color:var(--text-3)}

/* ════════════════════════════════════════════════════════════
   MISC
   ════════════════════════════════════════════════════════════ */
.empty{text-align:center;padding:54px 20px;color:var(--text-3)}
.empty h3{font-size:.92rem;color:var(--text-2);margin-bottom:6px;font-weight:600}
.hidden{display:none!important}

@media (max-width:760px){
  .hdr{height:auto;padding:11px 14px;flex-wrap:wrap;gap:10px}
  .main,.stats-bar,.nav{padding-left:14px;padding-right:14px}
  .ctrls{order:3}
  .clock-time{font-size:1rem}
}
</style>
</head>
<body>
<div class="layout">

  <!-- HEADER -->
  <header class="hdr">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="14" height="12" rx="1.5"/><path d="M15 8h4l3 4v4h-7V8z"/><circle cx="5.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
        </svg>
      </div>
      <div>
        <h1>Dispatch Operations</h1>
        <p>Real-time staffing board</p>
      </div>
    </div>

    <div class="hdr-right">
      <div class="ctrls">
        <div class="seg" id="styleSeg">
          <button data-style="control" class="on">Control</button>
          <button data-style="minimal">Minimal</button>
          <button data-style="terminal">Terminal</button>
        </div>
        <button class="icon-btn" id="densityBtn" title="Toggle density">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Toggle dark / light">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="live-pill"><span class="live-dot"></span>LIVE</div>
      <div class="clock">
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate">--</div>
      </div>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- NAV -->
  <nav class="nav" id="nav"></nav>

  <!-- MAIN -->
  <main class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search" id="searchInput" type="text" placeholder="Search by name or role…">
      </div>
      <button class="tbtn" id="onShiftBtn">
        <span class="sdot on"></span> On shift only
      </button>
      <div class="seg" id="viewSeg">
        <button data-view="cards" class="on">Roster</button>
        <button data-view="org">Org chart</button>
      </div>
    </div>
    <div id="cardsView"></div>
    <div id="orgView" class="hidden"></div>
  </main>

</div>

<script>
/* ═══════════════════════ DATA ═══════════════════════ */
const PROGS = {
  sdva:{ name:'San Diego VA',        short:'SDVA' },
  nctd:{ name:'NCTD',                short:'NCTD' },
  lbva:{ name:'Long Beach VA',       short:'LBVA' },
  stpa:{ name:"St Paul's PACE",      short:'STPA' },
  fhc: { name:'Family Health Center',short:'FHC'  },
};

const ORG = {
  supervisor:{ id:'sup', name:'Supervisor', role:'Supervisor', schedule:'07:00 - 16:00' },
  dataSupport:[
    { id:'flor', name:'Flor Pineda',     role:'Data Support', location:'San Diego',  schedule:'13:00 - 21:00' },
    { id:'fflo', name:'Fernando Flores', role:'Data Support', location:'Long Beach', schedule:'12:00 - 20:00' },
  ],
  leads:[
    { id:'ldr1', name:'Fernando Rivera', role:'Dispatch Lead', schedule:'05:00 - 14:00', programs:['sdva','nctd'] },
    { id:'ldr2', name:'Rene Ramos',      role:'Dispatch Lead', schedule:'09:30 - 18:00', programs:['lbva'] },
    { id:'ldr3', name:'Ivan Lopez',      role:'Dispatch Lead', schedule:'08:00 - 17:00', programs:['stpa','fhc'] },
  ],
  programs:{
    sdva:{ lead:'Fernando Rivera',
      dispatchers:[{ id:'cacos', name:'Carlos Acosta', role:'Dispatcher', schedule:'07:30 - 16:30' }],
      support:[{ id:'will', name:'William Veliz', role:'Support Team', schedule:'07:30 - 16:30' }] },
    nctd:{ lead:'Fernando Rivera',
      dispatchers:[{ id:'rcast', name:'Rene Castro', role:'Dispatcher', schedule:'09:45 - 18:45' }],
      support:[{ id:'will', name:'William Veliz', role:'Support Team', schedule:'07:30 - 16:30' }] },
    lbva:{ lead:'Rene Ramos',
      dispatchers:[
        { id:'anth', name:'Anthony Gomez',    role:'Dispatcher', schedule:'06:00 - 14:30' },
        { id:'quin', name:'Quinesha Pimpton', role:'Dispatcher', schedule:'10:30 - 19:00' }],
      support:[
        { id:'andr', name:'Andre Samayoa',  role:'Support Team', schedule:'06:00 - 15:30' },
        { id:'mari', name:'Mario Martinez', role:'Support Team', schedule:'10:00 - 19:00' }] },
    stpa:{ lead:'Ivan Lopez',
      dispatchers:[
        { id:'clau', name:'Claudia De La Cruz', role:'Dispatcher', schedule:'06:00 - 14:00' },
        { id:'jacq', name:'Jacquie Marroquin',  role:'Dispatcher', schedule:'09:00 - 18:00' }],
      support:[{ id:'alej', name:'Alejandro Jerez', role:'Support Team', schedule:'15:00 - 21:00' }] },
    fhc:{ lead:'Ivan Lopez',
      dispatchers:[{ id:'susa', name:'Susan Marroquin', role:'Dispatcher', schedule:'07:00 - 16:00' }],
      support:[{ id:'alej', name:'Alejandro Jerez', role:'Support Team', schedule:'15:00 - 21:00' }] },
  },
  closing:  { id:'luca',  name:'Luca Fajardo',  role:'Closing Dispatch',   schedule:'16:30 - 22:00' },
  overnight:{ id:'maria', name:'Maria Sanchez', role:'Overnight Dispatch', schedule:'21:00 - 06:00' },
};

/* ═══════════════════════ SHIFT LOGIC ═══════════════════════ */
function toMin(s){ const m=s.trim().match(/^(\d{1,2}):(\d{2})$/); return m? +m[1]*60 + +m[2] : null; }
function onShift(sched){
  if(!sched || sched==='24/7') return true;
  const p=sched.split(/\s*[-–]\s*/); if(p.length!==2) return false;
  const s=toMin(p[0]), e=toMin(p[1]); if(s===null||e===null) return false;
  const n=new Date(), c=n.getHours()*60+n.getMinutes();
  return e>s ? (c>=s&&c<e) : (c>=s||c<e);
}

/* ═══════════════════════ UTILS ═══════════════════════ */
function initials(n){ return n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }
function tagHTML(ids){ return ids.map(p=>`<span class="ptag">${PROGS[p].short}</span>`).join(''); }
function dot(a){ return `<span class="sdot ${a?'on':''}"></span>`; }
function statusTag(a){ return `<span class="status-tag ${a?'on':''}">${a?'On shift':'Off'}</span>`; }

function allStaff(){
  const seen=new Set(), out=[];
  const add=p=>{ if(!seen.has(p.id)){ seen.add(p.id); out.push(p); } };
  add(ORG.supervisor); ORG.dataSupport.forEach(add); ORG.leads.forEach(add);
  Object.values(ORG.programs).forEach(pg=>{ pg.dispatchers.forEach(add); pg.support.forEach(add); });
  add(ORG.closing); add(ORG.overnight);
  return out;
}

/* ═══════════════════════ STATE ═══════════════════════ */
let curTab='all', filterOn=false, query='', curView='cards';
const root=document.documentElement;
const LS=k=>'dispatch_'+k;

/* ═══════════════════════ CLOCK ═══════════════════════ */
function tick(){
  const n=new Date();
  document.getElementById('clockTime').textContent=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  document.getElementById('clockDate').textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

/* ═══════════════════════ STATS ═══════════════════════ */
function renderStats(){
  const all=allStaff(), active=all.filter(p=>onShift(p.schedule)).length;
  const pct=Math.round(active/all.length*100);
  document.getElementById('statsBar').innerHTML=`
    <div class="stat"><span class="sdot on"></span><b class="ok-num">${active}</b> on shift now</div>
    <div class="stat"><div class="stat-bar-mini"><i style="width:${pct}%"></i></div><span>${pct}% staffed</span></div>
    <div class="stat-sep"></div>
    <div class="stat"><b>${all.length}</b> total staff</div>
    <div class="stat-sep"></div>
    <div class="stat"><b>${Object.keys(PROGS).length}</b> programs</div>`;
}

/* ═══════════════════════ NAV ═══════════════════════ */
function renderNav(){
  const tabs=[{id:'all',label:'All staff'},...Object.entries(PROGS).map(([id,m])=>({id,label:m.name}))];
  document.getElementById('nav').innerHTML=tabs.map(t=>{
    const cnt=t.id==='all'?allStaff().length
      :[...(ORG.programs[t.id]?.dispatchers||[]),...(ORG.programs[t.id]?.support||[])].length;
    return `<button class="tab ${curTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}<span class="tab-badge">${cnt}</span></button>`;
  }).join('');
}
function setTab(id){ curTab=id; renderNav(); render(); }

/* ═══════════════════════ FILTER ═══════════════════════ */
function matches(p){
  if(!query) return true;
  const q=query.toLowerCase();
  return p.name.toLowerCase().includes(q) || (p.role||'').toLowerCase().includes(q);
}
function visible(p){ return matches(p) && (!filterOn || onShift(p.schedule)); }

/* ═══════════════════════ TEMPLATES ═══════════════════════ */
function pcardHTML(p, tags){
  const a=onShift(p.schedule);
  return `<div class="pcard ${a?'on':''}">
    <div class="av ${a?'on':''}">${initials(p.name)}</div>
    <div class="pi">
      <div class="pname">${p.name}</div>
      <div class="prole">${p.role}${p.location?` · ${p.location}`:''}</div>
      <div class="psched">${p.schedule}</div>
      ${tags?`<div class="ptags">${tags}</div>`:''}
    </div>
    <div class="pcard-r">${dot(a)}</div>
  </div>`;
}
function sitemHTML(p){
  const a=onShift(p.schedule);
  return `<div class="sitem ${a?'on':''}">
    <div class="av ${a?'on':''}">${initials(p.name)}</div>
    <div class="pi">
      <div class="sname">${p.name}</div>
      <div class="srole">${p.role}</div>
      <div class="ssched">${p.schedule}</div>
    </div>
    ${dot(a)}
  </div>`;
}

/* ═══════════════════════ CARDS VIEW ═══════════════════════ */
function renderCards(){
  const el=document.getElementById('cardsView');
  let h='';

  if(curTab==='all'){
    const ldrs=[...ORG.leads, ORG.supervisor, ...ORG.dataSupport].filter(visible);
    if(ldrs.length){
      h+=`<div class="sec"><span class="sec-label">Leadership &amp; Leads</span><div class="sec-line"></div></div><div class="cards-row">`;
      ORG.leads.forEach(l=>{ if(visible(l)) h+=pcardHTML(l, tagHTML(l.programs)); });
      if(visible(ORG.supervisor)) h+=pcardHTML(ORG.supervisor);
      ORG.dataSupport.forEach(p=>{ if(visible(p)) h+=pcardHTML(p); });
      h+=`</div>`;
    }

    h+=`<div class="sec"><span class="sec-label">Programs</span><div class="sec-line"></div></div>`;
    Object.entries(PROGS).forEach(([id,meta])=>{
      const pg=ORG.programs[id]; if(!pg) return;
      const all=[...pg.dispatchers,...pg.support];
      const shown=all.filter(visible); if(!shown.length) return;
      const cnt=all.filter(p=>onShift(p.schedule)).length;
      const pct=Math.round(cnt/all.length*100);
      h+=`<div class="prog-section">
        <div class="prog-hdr">
          <span class="prog-code">${meta.short}</span>
          <div class="prog-meta">
            <div class="prog-title">${meta.name}</div>
            <div class="prog-lead">Lead · ${pg.lead}</div>
          </div>
          <div class="prog-cov">
            <span class="cov-txt"><b>${cnt}</b> / ${all.length} on</span>
            <div class="cov-bar"><i style="width:${pct}%"></i></div>
          </div>
        </div>
        <div class="prog-grid">${shown.map(sitemHTML).join('')}</div>
      </div>`;
    });

    const ah=[ORG.closing,ORG.overnight].filter(visible);
    if(ah.length){
      h+=`<div class="sec"><span class="sec-label">After hours</span><div class="sec-line"></div></div><div class="ah-row">`;
      ah.forEach(p=>{
        const a=onShift(p.schedule);
        h+=`<div class="ah-card ${a?'on':''}">
          <div class="ah-label">${p.role}</div>
          <div class="ah-inner">
            <div class="av ${a?'on':''}">${initials(p.name)}</div>
            <div class="pi"><div class="pname">${p.name}</div><div class="psched">${p.schedule}</div></div>
            ${statusTag(a)}
          </div>
        </div>`;
      });
      h+=`</div>`;
    }
  } else {
    const pg=ORG.programs[curTab], meta=PROGS[curTab];
    if(!pg){ el.innerHTML='<div class="empty"><h3>No data</h3></div>'; return; }
    const lead=ORG.leads.find(l=>l.programs.includes(curTab));
    if(lead && visible(lead)){
      h+=`<div class="sec"><span class="sec-label">Dispatch Lead</span><div class="sec-line"></div></div><div class="cards-row">${pcardHTML(lead, tagHTML(lead.programs))}</div>`;
    }
    const disp=pg.dispatchers.filter(visible);
    if(disp.length) h+=`<div class="sec"><span class="sec-label">Dispatchers</span><div class="sec-line"></div></div><div class="cards-row">${disp.map(p=>pcardHTML(p)).join('')}</div>`;
    const supp=pg.support.filter(visible);
    if(supp.length) h+=`<div class="sec"><span class="sec-label">Support Team</span><div class="sec-line"></div></div><div class="cards-row">${supp.map(p=>pcardHTML(p)).join('')}</div>`;
    if(!disp.length && !supp.length && !(lead&&visible(lead))) h='<div class="empty"><h3>No staff match current filters</h3></div>';
  }
  el.innerHTML=h||'<div class="empty"><h3>No results found</h3></div>';
}

/* ═══════════════════════ ORG CHART ═══════════════════════ */
function orgNode(person){
  const a=person.schedule==='24/7'?true:onShift(person.schedule);
  return `<div class="org-node ${a?'on':''}">
    <div class="org-node-dot ${a?'on':''}"></div>
    <div class="org-nlabel">${person.role||''}</div>
    <div class="org-nname">${person.name}</div>
    <div class="org-nsched">${person.schedule}</div>
    ${person.programs?`<div class="org-ntags">${tagHTML(person.programs)}</div>`:''}
  </div>`;
}
function renderOrg(){
  const el=document.getElementById('orgView');
  let h=`<div class="org-scroller"><div class="org-tree">`;
  h+=`<div class="org-center">${orgNode({name:'Dispatch Manager',role:'Manager',schedule:'24/7'})}</div>`;
  h+=`<div class="org-vline"><div></div></div>`;
  h+=`<div class="org-center">${orgNode(ORG.supervisor)}</div>`;
  h+=`<div class="org-vline"><div></div></div>`;
  h+=`<div class="org-leads-row">`;
  ORG.leads.forEach(lead=>{ h+=`<div class="org-lead-col">${orgNode(lead)}</div>`; });
  h+=`</div>`;

  h+=`<div class="org-progs">`;
  ORG.leads.forEach(lead=>{
    lead.programs.forEach(pid=>{
      const meta=PROGS[pid], pg=ORG.programs[pid];
      h+=`<div class="org-prog">
        <div class="org-prog-name">${meta.name}<span class="ptag">${meta.short}</span></div>
        ${pg.dispatchers.map(p=>{ const a=onShift(p.schedule);
          return `<div class="org-row-sm"><span class="org-mini-dot ${a?'on':''}"></span><div><div class="org-mini-name">${p.name}</div><div class="org-mini-sched">${p.schedule}</div></div></div>`;
        }).join('')}
        ${pg.support.length?`<div class="org-supp-sep">Support</div>${pg.support.map(p=>{ const a=onShift(p.schedule);
          return `<div class="org-row-sm"><span class="org-mini-dot ${a?'on':''}"></span><div><div class="org-mini-name">${p.name}</div><div class="org-mini-sched">${p.schedule}</div></div></div>`;
        }).join('')}`:''}
      </div>`;
    });
  });
  h+=`</div>`;

  h+=`<div class="org-ah-row">`;
  [ORG.closing,ORG.overnight].forEach(p=>{ const a=onShift(p.schedule);
    h+=`<div class="org-ah-item ${a?'on':''}"><span class="org-mini-dot ${a?'on':''}" style="width:9px;height:9px"></span>
      <div><div class="org-ah-label">${p.role}</div><div class="org-ah-name">${p.name}</div><div class="org-ah-sched">${p.schedule}</div></div></div>`;
  });
  h+=`</div>`;

  h+=`<div class="org-ds-row">`;
  ORG.dataSupport.forEach(p=>{ const a=onShift(p.schedule);
    h+=`<div class="org-ah-item ${a?'on':''}"><span class="org-mini-dot ${a?'on':''}" style="width:9px;height:9px"></span>
      <div><div class="org-ah-label">Data Support · ${p.location}</div><div class="org-ah-name">${p.name}</div><div class="org-ah-sched">${p.schedule}</div></div></div>`;
  });
  h+=`</div>`;

  h+=`</div></div>`;
  el.innerHTML=h;
}

/* ═══════════════════════ RENDER ═══════════════════════ */
function render(){ renderCards(); renderOrg(); }

/* ═══════════════════════ VIEW / THEME / STYLE ═══════════════════════ */
function setView(v){
  curView=v;
  document.getElementById('cardsView').classList.toggle('hidden',v!=='cards');
  document.getElementById('orgView').classList.toggle('hidden',v!=='org');
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
}
function setStyle(s){
  root.setAttribute('data-style',s);
  document.querySelectorAll('#styleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.style===s));
  localStorage.setItem(LS('style'),s);
}
function setTheme(t){
  root.setAttribute('data-theme',t);
  document.getElementById('themeIcon').innerHTML = t==='dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  localStorage.setItem(LS('theme'),t);
}
function setDensity(d){
  root.setAttribute('data-density',d);
  localStorage.setItem(LS('density'),d);
}

/* ═══════════════════════ EVENTS ═══════════════════════ */
document.getElementById('searchInput').addEventListener('input',e=>{ query=e.target.value; render(); });
document.getElementById('onShiftBtn').addEventListener('click',function(){
  filterOn=!filterOn; this.classList.toggle('on',filterOn); render();
});
document.getElementById('styleSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setStyle(b.dataset.style); });
document.getElementById('viewSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.view); });
document.getElementById('themeBtn').addEventListener('click',()=> setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
document.getElementById('densityBtn').addEventListener('click',()=> setDensity(root.getAttribute('data-density')==='balanced'?'compact':'balanced'));

/* ═══════════════════════ INIT ═══════════════════════ */
(function init(){
  const st=localStorage.getItem(LS('style')); if(st) setStyle(st);
  const th=localStorage.getItem(LS('theme')); setTheme(th||'dark');
  const de=localStorage.getItem(LS('density')); if(de) setDensity(de);
  tick(); renderStats(); renderNav(); render();
  setInterval(tick,1000);
  setInterval(()=>{ renderStats(); render(); },30000);
})();
</script>
</body>
</html>
