<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Coverage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --font:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:'Atkinson Hyperlegible Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --bg:#f2f5f8; --paper:#ffffff; --ink:#0f1f2e; --ink-2:#3a4a5a; --ink-3:#5d6b79;
  --line:#d3dbe4; --line-2:#edf1f5;
  --band:#0f2a43; --band-ink:#ffffff; --band-2:#c5d3e2;
  --on:#1d5fa6; --on-ink:#ffffff; --later-ink:#154a82;
  --done:#d3dbe4; --done-ink:#2c3b4a;
  --open:#b45309; --open-ink:#8a3f06; --open-bg:#fff4e5; --warn-line:#e8c48f;
  --away-bg:#eef1f4; --away-line:#7b8896;
  --now:#d1293d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e151c; --paper:#151f29; --ink:#e6edf3; --ink-2:#b3c0cc; --ink-3:#8f9fae;
    --line:#2a3a4a; --line-2:#1f2c38;
    --band:#0a1622; --band-2:#9fb2c4;
    --on:#3b82c9; --later-ink:#9cc4ee; --done:#2c3a48; --done-ink:#c9d4de;
    --open:#e0a050; --open-ink:#f0bd80; --open-bg:#2a2013; --warn-line:#5a4422;
    --away-bg:#1c2733; --away-line:#7b8896; --now:#f05264;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151c; --paper:#151f29; --ink:#e6edf3; --ink-2:#b3c0cc; --ink-3:#8f9fae;
  --line:#2a3a4a; --line-2:#1f2c38;
  --band:#0a1622; --band-2:#9fb2c4;
  --on:#3b82c9; --later-ink:#9cc4ee; --done:#2c3a48; --done-ink:#c9d4de;
  --open:#e0a050; --open-ink:#f0bd80; --open-bg:#2a2013; --warn-line:#5a4422;
  --away-bg:#1c2733; --away-line:#7b8896; --now:#f05264;
}

body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.hidden{display:none!important}
button,input{font:inherit;color:inherit}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.hdr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-top:24px}
.hdr h1{font-size:30px;font-weight:700;line-height:1.15}
.hdr .sub{color:var(--band-2);font-size:15px;margin-top:2px}
.clock{display:flex;align-items:center;gap:10px}
.clock b{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.clock span{color:var(--band-2)}
.theme{background:none;border:1px solid var(--band-2);border-radius:4px;cursor:pointer;padding:6px 10px;color:var(--band-ink);font-size:14px;min-height:36px}
.views{display:flex;gap:24px;margin-top:18px;flex-wrap:wrap}
.views button{background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;padding:12px 0;color:var(--band-2)}
.views button:hover{color:var(--band-ink)}
.views button.on{color:var(--band-ink);font-weight:700;border-bottom-color:var(--band-ink)}

/* notices */
.notices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:24px}
.notices:empty{display:none}
.notice{background:var(--open-bg);border:1px solid var(--warn-line);border-radius:6px;padding:14px 16px}
.notice b{display:block}

/* filters */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0 0}
.progs{display:flex;gap:6px;flex-wrap:wrap}
.progs button{background:var(--paper);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:0 14px;cursor:pointer;color:var(--ink-2)}
.progs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.search{display:flex;flex:1 1 200px;max-width:320px}
.search input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink-2);cursor:pointer;user-select:none;min-height:44px}
.chk input{width:18px;height:18px;accent-color:var(--on)}

/* section headings */
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:32px 0 12px}
.sec-h h2{font-size:22px}
.sec-h span{color:var(--ink-2)}
.sec-h b{color:var(--on)}

/* right-now cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h h3{font-size:17px}
.card-h .cv{font-family:var(--mono);font-weight:600;white-space:nowrap}
.card .meta{font-size:14px;color:var(--ink-2);margin-top:-8px}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:22px;height:8px;border-radius:2px;background:var(--done)}
.pips i.on{background:var(--on)}
.pips i.open{background:none;border:1.5px dashed var(--open)}
.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.lbl.on{color:var(--on)}
.who{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.who:last-child{border-bottom:none}
.who:hover span:first-child{text-decoration:underline}
.who .t{font-size:14px;color:var(--ink-2);white-space:nowrap}
.who.later{color:var(--ink-2)}
.openbox{border:1.5px dashed var(--open);background:var(--open-bg);border-radius:4px;padding:8px 10px;color:var(--open-ink);cursor:pointer}
.muted{font-size:14px;color:var(--ink-2)}
.none{color:var(--ink-3);font-size:14px}

/* full-day timeline */
.tl{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.tl-in{min-width:900px}
.tl-row{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--line-2)}
.tl-row:last-child{border-bottom:none}
.tl-name{padding:7px 14px;min-width:0;cursor:pointer;position:sticky;left:0;z-index:4;background:var(--paper);border-right:1px solid var(--line)}
.tl-name:hover .nm > span:first-child{text-decoration:underline}
.nm{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.nm > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rl{color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;min-height:46px;
  background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px);
  background-size:calc(100% / 24) 100%}
.bar-s{position:absolute;top:10px;bottom:10px;border-radius:3px;display:flex;align-items:center;padding:0 8px;
  white-space:nowrap;overflow:hidden;font-family:var(--mono);font-size:12px}
.bar-s.on{background:var(--on);color:var(--on-ink)}
.bar-s.later{background:var(--paper);border:1.5px solid var(--on);color:var(--later-ink)}
.bar-s.done{background:var(--done);color:var(--done-ink)}
.bar-s.open{background:var(--open-bg);border:1.5px dashed var(--open);color:var(--open-ink)}
.bar-s.away{background:var(--away-bg);border:1.5px dashed var(--away-line);color:var(--ink-2)}
.offday{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:2;pointer-events:none}
.axis{border-bottom:1px solid var(--line)}
.axis .tl-name{cursor:default;color:var(--ink-2);font-size:13px;display:flex;align-items:center;font-weight:400}
.axis .track{min-height:32px;background:none}
.axis .hr{position:absolute;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.axis .nowtag{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--now);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 6px;border-radius:3px;z-index:3}
.grp{display:flex;align-items:baseline;gap:10px;padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.grp .gt{position:sticky;left:14px;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.grp h2{font-size:15px;font-weight:700}
.grp .meta{color:var(--ink-2);font-size:13px}
.grp .cov{position:sticky;right:14px;margin-left:auto;font-size:13px;color:var(--ink-2)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;border-radius:3px;white-space:nowrap}
.tag.leave{background:var(--open-bg);color:var(--open-ink);border:1px solid var(--warn-line)}
.tag.open{background:var(--open-bg);color:var(--open-ink);border:1px dashed var(--open)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:14px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:28px;height:12px;border-radius:3px}

/* roster */
.tbl-wrap{overflow-x:auto;margin-top:24px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
table{width:100%;min-width:680px;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:13px;font-weight:700;color:var(--ink-2);background:var(--bg);border-bottom:1px solid var(--line)}
td.nmcell{cursor:pointer;font-weight:700}
td.nmcell:hover{text-decoration:underline}
.wk{color:var(--ink-2);font-size:13px;font-weight:400}
.st-on{color:var(--on);font-weight:700}
.st-off{color:var(--ink-3)}

/* org */
.org{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 22px;margin-top:24px}
.org ul{list-style:none;padding-left:22px;border-left:1px solid var(--line);margin-left:6px}
.org > ul{padding-left:0;border-left:none;margin-left:0}
.org li{padding:5px 0}
.org .who{display:inline;border:none;padding:0;font-weight:700}
.org .what{color:var(--ink-2)}
.org .hrs{color:var(--ink-3);font-size:13px;margin-left:6px}
.org .sec{color:var(--ink-3);font-size:13px;margin-top:8px}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--paper);border-left:1px solid var(--line);
  padding:22px;overflow-y:auto;transform:translateX(100%);transition:transform .18s,visibility .18s;visibility:hidden;z-index:20}
.drawer.open{transform:none;visibility:visible;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
.drawer h3{font-size:20px;padding-right:70px}
.drawer .x{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:6px 10px;color:var(--ink-2)}
.drawer h4{font-size:13px;color:var(--ink-3);font-weight:700;margin:18px 0 4px}
.drawer ul{padding-left:18px}
.drawer li{margin:3px 0;color:var(--ink-2)}
.drawer p{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}

footer{color:var(--ink-3);font-size:13px;padding:24px 0 48px}

@media (max-width:640px){
  .wrap{padding:0 16px}
  .hdr h1{font-size:24px}
  .clock b{font-size:32px}
  .tl-row{grid-template-columns:150px 1fr}
  .tl-name{padding:7px 10px}
  .tl-in{min-width:780px}
  .search{max-width:none}
}
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="hdr">
      <div>
        <h1>Dispatch coverage</h1>
        <div class="sub" id="dateLine">—</div>
      </div>
      <div class="clock"><b id="clock">--:--</b><span>PT</span><button class="theme" id="themeBtn">Dark</button></div>
    </div>
    <nav class="views" id="views" aria-label="Views">
      <button data-v="timeline" class="on">Today</button>
      <button data-v="roster">Roster</button>
      <button data-v="org">Who reports to who</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="notices" id="notices"></div>

  <div class="bar">
    <div class="progs" id="progs" role="group" aria-label="Program"></div>
    <label class="search"><span class="hidden">Search</span><input id="q" type="search" placeholder="Search name or role" aria-label="Search name or role"></label>
    <label class="chk"><input type="checkbox" id="onlyOn"> On shift now</label>
  </div>

  <section id="v-timeline">
    <div class="sec-h"><h2>Right now</h2><span id="count"></span></div>
    <div class="cards" id="cards"></div>
    <div class="sec-h"><h2>Full day</h2><span>Every shift, 00:00 to 24:00</span></div>
    <div id="tlBox"></div>
    <div class="legend">
      <span><i style="background:var(--on)"></i>On shift now</span>
      <span><i style="border:1.5px solid var(--on)"></i>Later today</span>
      <span><i style="background:var(--done)"></i>Done for today</span>
      <span><i style="border:1.5px dashed var(--open);background:var(--open-bg)"></i>Open position</span>
      <span><i style="width:2px;height:16px;border-radius:0;background:var(--now)"></i>Now</span>
    </div>
  </section>
  <section id="v-roster" class="hidden"></section>
  <section id="v-org" class="hidden"></section>

  <footer>All times are Pacific (PT). Click a name to see what that role covers.</footer>
</main>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
/* ═══════════ DATA ═══════════
   schedule: "HH:MM - HH:MM", or by day: { default:"...", sat:"...", sun:null }
             (by day: default = Mon–Fri; a weekend day only counts when it's listed; null = off)
   endDate:  last day worked (YYYY-MM-DD, Pacific) — hidden after that
   open:     unfilled position
   away:     temporarily out (vacation, leave) — shown, never counted as on shift */
const PROGS = {
  sdva:{ name:'San Diego VA',         short:'SDVA' },
  nctd:{ name:'NCTD',                 short:'NCTD' },
  lbva:{ name:'Long Beach VA',        short:'LBVA' },
  stpa:{ name:"St Paul's PACE",       short:"St Paul's" },
  fhc: { name:'Family Health Center', short:'FHC'  },
};

const STAFF = {
  sup:   { name:'Supervisor',         role:'Supervisor',         schedule:'07:00 - 16:00' },
  ldr1:  { name:'Fernando Rivera',    role:'Dispatch Lead',      schedule:'05:00 - 14:00' },
  ldr2:  { name:'Rene Ramos',         role:'Dispatch Lead',      schedule:'09:30 - 18:00' },
  ldr3:  { name:'Ivan Lopez',         role:'Dispatch Lead',      schedule:'07:00 - 19:00' },

  flor:  { name:'Flor Pineda',        role:'Data Support', location:'San Diego',  schedule:'13:00 - 21:30', away:'On vacation' },
  cflo:  { name:'Carlos Flores',      role:'Data Support', location:'Long Beach',
           schedule:{ default:'13:00 - 21:30', sat:'07:00 - 15:00', sun:null }, note:'Sun: enters schedules only' },

  cacos: { name:'Carlos Acosta',      role:'Dispatcher',   schedule:'07:30 - 16:30' },
  rcast: { name:'Rene Castro',        role:'Dispatcher',   schedule:'09:30 - 19:30' },
  will:  { name:'William Veliz',      role:'Support Team',
           schedule:{ default:'07:30 - 16:30', sat:null, sun:'05:45 - 14:00' }, endDate:'2026-10-18' },
  willOpen:{ open:true, name:'Open position', role:'Support Team', replaces:'will', interview:'2026-10-14',
           schedule:{ default:'07:30 - 16:30', sat:null, sun:'05:45 - 14:00' } },

  anth:  { name:'Anthony Gomez',      role:'Dispatcher',   schedule:'06:00 - 14:30' },
  andr:  { name:'Andre Samayoa',      role:'Support Team', schedule:{ default:'06:00 - 15:30', sun:'14:45 - 22:00' } },
  mari:  { name:'Mario Martinez',     role:'Support Team',
           schedule:{ default:'10:00 - 19:30', fri:'12:00 - 21:30', sat:'21:45 - 06:00', sun:null } },
  jpar:  { name:'Jonathan Paredes',   role:'Support Team',
           schedule:{ default:'09:00 - 18:00', sat:null, sun:null } },

  clau:  { name:'Claudia De La Cruz', role:'Dispatcher',   schedule:'06:00 - 14:00' },
  jacq:  { name:'Jacquie Marroquin',  role:'Dispatcher',   schedule:{ default:'09:00 - 18:00', sat:'14:45 - 22:00' } },
  susa:  { name:'Susan Marroquin',    role:'Dispatcher',   schedule:'07:00 - 17:00' },
  fhcOpen:{ open:true, name:'Open position', role:'Dispatcher', title:'Part-time dispatcher', interview:'2026-10-14',
           schedule:'06:00 - 12:00' },
  alej:  { name:'Alejandro Jerez',    role:'Support Team', schedule:'12:00 - 20:00' },

  luca:  { name:'Luca Fajardo',       role:'Closing Dispatch',   schedule:'16:30 - 22:00' },
  maria: { name:'Maria Sanchez',      role:'Overnight Dispatch', schedule:{ default:'21:00 - 06:00', sun:'21:45 - 06:00' } },
};

const ORG = {
  leads:{ ldr1:['sdva','nctd'], ldr2:['lbva'], ldr3:['stpa','fhc'] },
  programs:{
    sdva:{ lead:'ldr1', dispatchers:['cacos'],        support:['will','willOpen'] },
    nctd:{ lead:'ldr1', dispatchers:['rcast'],        support:['will','willOpen'] },
    lbva:{ lead:'ldr2', dispatchers:['anth'],         support:['andr','mari','jpar'] },
    stpa:{ lead:'ldr3', dispatchers:['clau','jacq'],  support:['alej'] },
    fhc: { lead:'ldr3', dispatchers:['susa','fhcOpen'], support:['alej'] },
  },
  afterHours:['luca','maria'],
  dataSupport:['flor','cflo'],
};

const ROLE_DEFS = {
  'Dispatch Manager':{
    purpose:'Strategic oversight of all dispatch operations: service performance, staffing, accountability and continuous improvement.',
    duties:['Set department goals and operational standards.','Oversee all dispatch programs and staffing plans.','Monitor KPI performance and service outcomes.','Lead operational meetings and escalations.','Approve process improvements and workflow changes.','Coaching, development and corrective actions.','Support client relationships and communication.'],
    owns:['Department performance','Staffing strategy','Escalations','SOP development'],
    measured:['OTP performance','Fewer service failures','Team development','Program stability'],
  },
  'Supervisor':{
    purpose:'Support daily execution by monitoring operations, coaching staff and keeping accountability.',
    duties:['Monitor live dispatch performance.','Audit communication and trip execution.','Support service recovery.','Review delays and operational concerns.','Coach dispatch staff.','Balance schedules and workload.','Escalate issues when needed.'],
    owns:['Daily execution','Accountability','Coaching','Service recovery'],
    measured:['Fewer escalations','Faster response times','Dispatch compliance'],
  },
  'Dispatch Lead':{
    purpose:'Own the assigned programs and give the dispatchers direction, decisions and support.',
    duties:['Oversee assigned program activity.','Review assignments and service flow.','Watch same-day changes.','Support dispatch decisions.','Make sure communication standards are followed.','Coach and support dispatchers.'],
    owns:['Program performance','Assignment quality','Service continuity'],
    measured:['Program OTP','Fewer operational gaps'],
  },
  'Dispatcher':{
    purpose:'Run transportation operations and keep service on time.',
    duties:['Assign and manage trips.','Dispatch drivers.','Monitor service execution.','Handle same-day schedule changes.','Run recovery plans.','Keep RouteGenie and VetRide updated.','Keep documentation current.'],
    owns:['Driver assignments','Trip completion','Schedule execution'],
    measured:['Trip completion','Assignment efficiency','Fewer delays'],
  },
  'Support Team':{
    purpose:'Back up dispatch with communication, monitoring and follow-up.',
    duties:['Watch VetRide for same-day add-ons.','Watch dispatch queues and emails.','Flag urgent requests.','Answer inbound calls and route them.','Give passengers ETA updates and courtesy delay calls.','Relay changes to drivers.','Keep dispatch notes up to date.'],
    owns:['VetRide monitoring','Email','Phone coverage','ETA calls','Follow-up'],
    measured:['Response time','Communication quality','Fewer missed requests'],
  },
  'Closing Dispatch':{
    purpose:'Set up the next day and keep the evening covered.',
    duties:['Review next-day schedules.','Audit manifests.','Confirm staffing is ready.','Monitor evening operations.','Escalate concerns.','Check trip setup.'],
    owns:['Next-day readiness','Manifest accuracy'],
    measured:['Fewer morning corrections','Better preparation'],
  },
  'Overnight Dispatch':{
    purpose:'Cover the overnight and hand the morning a clean board.',
    duties:['Review next-day schedules.','Audit manifests.','Confirm staffing is ready.','Monitor overnight operations.','Escalate concerns.','Check trip setup.'],
    owns:['Next-day readiness','Manifest accuracy'],
    measured:['Fewer morning corrections','Better preparation'],
  },
  'Data Support':{
    purpose:'Keep trip setup and operational data accurate so dispatch can execute.',
    duties:['Enter and update trip information.','Review imports for accuracy.','Check required trip information.','Prepare schedules for dispatch review.','Audit records and fix discrepancies.','Escalate missing information.','Support corrections and reporting.'],
    owns:['Data integrity','Trip setup','Manifest readiness'],
    measured:['Data accuracy','Fewer corrections','Operational readiness'],
  },
};

/* ═══════════ PACIFIC TIME ═══════════ */
const TZ = 'America/Los_Angeles';
const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_NAMES = {mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun'};
function pt(d=new Date()){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'})
    .formatToParts(d).map(x=>[x.type,x.value]));
  return { min:+p.hour*60 + +p.minute, dow:p.weekday.toLowerCase().slice(0,3),
           date:`${p.year}-${p.month}-${p.day}`, hm:`${p.hour}:${p.minute}` };
}
function prevDow(dow){ return DAYS[(DAYS.indexOf(dow)+6)%7]; }
function fmtDate(iso,opts={weekday:'short',month:'short',day:'numeric'}){
  return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',{...opts,timeZone:'UTC'});
}
function addDays(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

/* ═══════════ SHIFT LOGIC ═══════════ */
function toMin(s){ const m=s.trim().match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1]*60 + +m[2] : null; }
function parse(s){ if(!s) return null; const p=s.split(/\s*[-–]\s*/); if(p.length!==2) return null;
  const a=toMin(p[0]), b=toMin(p[1]); return a===null||b===null ? null : {s:a,e:b}; }
function schedOn(p,dow){
  const sc=p.schedule;
  if(typeof sc==='string') return sc;
  if(dow in sc) return sc[dow];
  return ['sat','sun'].includes(dow) ? null : sc.default;   // weekends only when listed
}
function onShift(p,now){
  if(p.away) return false;
  const t=parse(schedOn(p,now.dow));
  if(t && (t.e>t.s ? now.min>=t.s && now.min<t.e : now.min>=t.s)) return true;
  const y=parse(schedOn(p,prevDow(now.dow)));           // overnight shift that started yesterday
  return !!(y && y.e<=y.s && now.min<y.e);
}
function active(p,now){ return !p.endDate || now.date<=p.endDate; }
function weekLabel(p){
  const sc=p.schedule; if(typeof sc==='string') return sc;
  const order=['mon','tue','wed','thu','fri','sat','sun'];
  const vals=order.map(d=> schedOn(p,d));
  const known=order.map(d=> d in sc || !['sat','sun'].includes(d));
  const out=[]; let i=0;
  while(i<7){ if(!known[i]){ i++; continue; }
    let j=i; while(j+1<7 && known[j+1] && vals[j+1]===vals[i]) j++;
    const days = i===j ? DAY_NAMES[order[i]] : `${DAY_NAMES[order[i]]}–${DAY_NAMES[order[j]]}`;
    out.push(`${days} ${vals[i]||'off'}`); i=j+1; }
  return out.join(' · ');
}
function displayName(p){ return p.open ? (p.title||'Open position') : p.name; }
function openNote(p,now){
  const bits=[];
  if(p.replaces){ const r=STAFF[p.replaces];
    bits.push(active(r,now) ? `Replacing ${r.name}` : `Vacant since ${fmtDate(addDays(r.endDate,1),{month:'numeric',day:'numeric'})}`); }
  if(p.interview && now.date<=p.interview) bits.push(`interviews ${fmtDate(p.interview,{weekday:'short',month:'numeric',day:'numeric'})}`);
  return bits.join(' · ');
}

/* ═══════════ STATE ═══════════ */
let view='timeline', prog='all', query='', onlyOn=false;
const store={ get(k){ try{return localStorage.getItem('dispatch_'+k);}catch(e){return null;} },
              set(k,v){ try{localStorage.setItem('dispatch_'+k,v);}catch(e){} } };

function progIds(){ return prog==='all' ? Object.keys(PROGS) : [prog]; }
function matches(p){
  if(!query) return true; const q=query.toLowerCase();
  return displayName(p).toLowerCase().includes(q) || p.role.toLowerCase().includes(q) || (p.open && 'open'.includes(q));
}
function show(id,now){ const p=STAFF[id]; return active(p,now) && matches(p) && (!onlyOn || (!p.open && onShift(p,now))); }

/* groups for the current filter: [{title, meta, ids}] */
function groups(now){
  const g=[];
  progIds().forEach(pid=>{
    const pg=ORG.programs[pid], meta=PROGS[pid];
    const ids = prog==='all' ? [...pg.dispatchers,...pg.support] : [pg.lead,...pg.dispatchers,...pg.support];
    g.push({ title:meta.name, meta:`Lead: ${STAFF[pg.lead].name}`, ids, prog:pid });
  });
  if(prog==='all'){ g.push({ title:'Leads & supervisor', ids:['ldr1','ldr2','ldr3','sup'] });
                    g.push({ title:'Evening & overnight', ids:ORG.afterHours });
                    g.push({ title:'Data support', ids:ORG.dataSupport }); }
  return g.map(x=>({...x, all:x.ids.filter(id=>active(STAFF[id],now)), ids:x.ids.filter(id=>show(id,now))}))
          .filter(x=>x.ids.length);
}

/* ═══════════ SHIFT STATE ═══════════ */
const hhmm = m => String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
// where someone is in their day: on (with end), later (with start), done (with end), off, open, away
function status(p,now){
  if(p.open) return {state:'open'};
  if(p.away) return {state:'away'};
  const t=parse(schedOn(p,now.dow)), y=parse(schedOn(p,prevDow(now.dow)));
  if(y && y.e<=y.s && now.min<y.e) return {state:'on', end:hhmm(y.e)};
  if(!t) return {state:'off'};
  if(now.min<t.s) return {state:'later', start:hhmm(t.s)};
  if(t.e<=t.s || now.min<t.e) return {state:'on', end:hhmm(t.e)};
  return {state:'done', end:hhmm(t.e)};
}

/* ═══════════ RENDER: TIMELINE ═══════════ */
const pct = m => (m/1440*100).toFixed(3)+'%';
function bars(p,now){
  const today=parse(schedOn(p,now.dow)), y=parse(schedOn(p,prevDow(now.dow)));
  const on = !p.open && onShift(p,now), base = p.open ? 'open' : p.away ? 'away' : '';
  let h='';
  if(y && y.e<=y.s && y.e>0){                              // tail of last night's shift
    const live = on && now.min<y.e;
    const cls = base || (live ? 'on' : 'done');
    h+=`<div class="bar-s ${cls}" style="left:0;width:${pct(y.e)}" title="${schedOn(p,prevDow(now.dow))} (from yesterday)"></div>`;
  }
  if(today){
    const end = today.e>today.s ? today.e : 1440;
    const live = on && now.min>=today.s;
    const cls = base || (live ? 'on' : now.min<today.s ? 'later' : 'done');
    const label = schedOn(p,now.dow).replace(' - ','–');
    h+=`<div class="bar-s ${cls}" style="left:${pct(today.s)};width:${pct(end-today.s)}" title="${label}">${label}</div>`;
  } else if(!(y && y.e<=y.s)) {
    h+=`<span class="offday">Off today</span>`;
  }
  return h;
}
function tlRow(id,now){
  const p=STAFF[id];
  let tags='';
  if(p.endDate) tags+=`<span class="tag leave">Last day ${fmtDate(p.endDate,{weekday:'short',month:'numeric',day:'numeric'})}</span>`;
  if(p.open) tags+=`<span class="tag open">Open</span>`;
  if(p.away) tags+=`<span class="tag leave">${p.away}</span>`;
  const sub = p.open ? [p.role, openNote(p,now)].filter(Boolean).join(' · ')
                     : [p.role, p.location, p.note].filter(Boolean).join(' · ');
  return `<div class="tl-row">
    <div class="tl-name" data-id="${id}"><div class="nm"><span>${displayName(p)}</span>${tags}</div><div class="rl">${sub}</div></div>
    <div class="track">${bars(p,now)}<div class="nowline" style="left:${pct(now.min)}"></div></div>
  </div>`;
}
function renderTimeline(now){
  let hrs=''; for(let h=0;h<24;h+=2) hrs+=`<span class="hr" style="left:${pct(h*60+(h?0:20))}">${String(h).padStart(2,'0')}</span>`;
  let h=`<div class="tl"><div class="tl-in">
    <div class="tl-row axis"><div class="tl-name">${fmtDate(now.date)}</div>
      <div class="track">${hrs}<span class="nowtag" style="left:${pct(now.min)}">${now.hm}</span></div></div>`;
  const gs=groups(now);
  gs.forEach(g=>{
    const on=g.all.filter(id=>!STAFF[id].open && onShift(STAFF[id],now)).length;
    const total=g.all.filter(id=>!STAFF[id].open).length;
    h+=`<div class="grp"><span class="gt"><h2>${g.title}</h2>${g.meta?`<span class="meta">${g.meta}</span>`:''}</span>
        <span class="cov">${on} of ${total} on now</span></div>`;
    g.ids.forEach(id=>{ h+=tlRow(id,now); });
  });
  if(!gs.length) h+=`<div class="grp"><span class="meta">Nobody matches these filters.</span></div>`;
  h+=`</div></div>`;
  const el=document.getElementById('tlBox'), prev=el.querySelector('.tl')?.scrollLeft;
  el.innerHTML=h;
  const tl=el.querySelector('.tl');
  if(prev!==undefined) tl.scrollLeft=prev;               // keep the user's scroll on refresh
  else if(tl.scrollWidth>tl.clientWidth){                // narrow screen: start the view at 05:00
    const track=tl.querySelector('.track'); tl.scrollLeft=track.offsetWidth*5/24;
  }
}

/* ═══════════ RENDER: RIGHT-NOW CARDS ═══════════ */
function renderCards(now){
  const gs=groups(now);
  document.getElementById('cards').innerHTML = gs.map(g=>{
    const ps=g.ids.map(id=>({id, p:STAFF[id], st:status(STAFF[id],now)}));
    const staff=g.all.filter(id=>!STAFF[id].open);
    const onCount=staff.filter(id=>onShift(STAFF[id],now)).length;
    const pips=[...staff.map(id=>`<i class="${onShift(STAFF[id],now)?'on':''}"></i>`), ...g.all.filter(id=>STAFF[id].open).map(()=>'<i class="open"></i>')].join('');
    const on=ps.filter(x=>x.st.state==='on'), later=ps.filter(x=>x.st.state==='later');
    const done=ps.filter(x=>x.st.state==='done'||x.st.state==='off'), open=ps.filter(x=>x.st.state==='open'), away=ps.filter(x=>x.st.state==='away');
    const row=(x,right,cls='')=>`<div class="who ${cls}" data-id="${x.id}"><span>${x.p.name}</span><span class="t">${right}</span></div>`;
    let h=`<section class="card"><div class="card-h"><h3>${g.title}</h3><span class="cv">${onCount} of ${staff.length} on</span></div>`;
    if(g.meta) h+=`<div class="meta">${g.meta}</div>`;
    h+=`<div class="pips" aria-hidden="true">${pips}</div>`;
    h+= on.length ? `<div><div class="lbl on">On now</div>${on.map(x=>row(x,'until '+x.st.end)).join('')}</div>`
                  : `<div class="none">Nobody on right now</div>`;
    if(later.length) h+=`<div><div class="lbl">Later today</div>${later.map(x=>row(x,'from '+x.st.start,'later')).join('')}</div>`;
    if(open.length) h+=open.map(x=>`<div class="openbox" data-id="${x.id}"><b>Open:</b> ${(x.p.title||x.p.role).toLowerCase()}, ${(schedOn(x.p,now.dow)||weekLabel(x.p)).replace(' - ','–')}${openNote(x.p,now)?` · ${openNote(x.p,now)}`:''}</div>`).join('');
    if(away.length) h+=`<div class="muted">${away.map(x=>`${x.p.name} · ${x.p.away.toLowerCase()}`).join('<br>')}</div>`;
    if(done.length) h+=`<div class="muted">Done or off: ${done.map(x=>x.p.name+(x.st.end?` (${x.st.end})`:'')).join(', ')}</div>`;
    return h+`</section>`;
  }).join('') || `<div class="none">Nobody matches these filters.</div>`;
}

/* ═══════════ RENDER: ROSTER ═══════════ */
function renderRoster(now){
  const progsOf={};
  Object.entries(ORG.programs).forEach(([pid,pg])=>[...pg.dispatchers,...pg.support].forEach(id=>(progsOf[id]=progsOf[id]||[]).push(PROGS[pid].short)));
  Object.entries(ORG.leads).forEach(([id,ps])=>progsOf[id]=ps.map(x=>PROGS[x].short));
  ORG.afterHours.forEach(id=>progsOf[id]=['All programs']);
  ORG.dataSupport.forEach(id=>progsOf[id]=[STAFF[id].location]);
  progsOf.sup=['All programs'];

  const seen=new Set(), rows=[];
  groups(now).forEach(g=>g.ids.forEach(id=>{ if(!seen.has(id)){ seen.add(id); rows.push(id); } }));
  let h=`<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Program</th><th>Today</th><th>Week</th><th>Now</th></tr></thead><tbody>`;
  rows.forEach(id=>{
    const p=STAFF[id], on=!p.open && onShift(p,now), today=schedOn(p,now.dow);
    let extra='';
    if(p.endDate) extra=`<div class="wk">Last day ${fmtDate(p.endDate)}</div>`;
    if(p.open) extra=`<div class="wk">${openNote(p,now)}</div>`;
    if(p.away) extra=`<div class="wk">${p.away}</div>`;
    h+=`<tr><td class="nmcell" data-id="${id}">${displayName(p)}${extra}</td><td>${p.role}</td><td>${(progsOf[id]||[]).join(', ')}</td>
      <td class="t">${today||'Off'}</td><td class="wk">${typeof p.schedule==='string'?'':weekLabel(p)}${p.note?`<br>${p.note}`:''}</td>
      <td>${p.open?'<span class="st-off">Hiring</span>':p.away?'<span class="st-off">Away</span>':on?'<span class="st-on">On shift</span>':'<span class="st-off">Off</span>'}</td></tr>`;
  });
  if(!rows.length) h+=`<tr><td colspan="6" class="wk">Nobody matches these filters.</td></tr>`;
  h+=`</tbody></table></div>`;
  document.getElementById('v-roster').innerHTML=h;
}

/* ═══════════ RENDER: ORG ═══════════ */
function renderOrg(now){
  const li=(id,extra='')=>{ const p=STAFF[id]; if(!active(p,now)) return '';
    const hrs = typeof p.schedule==='string' ? p.schedule : weekLabel(p);
    return `<li><span class="who" data-id="${id}">${displayName(p)}</span> <span class="what">· ${p.role}${p.open?` (${openNote(p,now)})`:''}${p.away?` (${p.away.toLowerCase()})`:''}</span><span class="hrs t">${hrs}</span>${extra}</li>`; };
  let h=`<div class="org"><ul><li><span class="who">Dispatch Manager</span><ul>${li('sup',
    `<ul>${Object.entries(ORG.leads).map(([lid,ps])=>li(lid,
      `<ul>${ps.map(pid=>{ const pg=ORG.programs[pid];
        return `<li><span class="who">${PROGS[pid].name}</span><ul>${[...pg.dispatchers,...pg.support].map(id=>li(id)).join('')}</ul></li>`; }).join('')}</ul>`
    )).join('')}</ul>`)}
    <li class="sec">Evening &amp; overnight</li>${ORG.afterHours.map(id=>li(id)).join('')}
    <li class="sec">Data support</li>${ORG.dataSupport.map(id=>li(id)).join('')}
  </ul></li></ul></div>`;
  document.getElementById('v-org').innerHTML=h;
}

/* ═══════════ HEADER / NOTICES ═══════════ */
function renderHeader(now){
  document.getElementById('clock').textContent=now.hm;
  document.getElementById('dateLine').textContent=fmtDate(now.date,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · Pacific time';
}
function renderNotices(now){
  const n=[];
  Object.values(STAFF).forEach(p=>{
    if(p.endDate && active(p,now)) n.push(['Leaving', `${p.name}'s last day is ${fmtDate(p.endDate,{weekday:'long',month:'long',day:'numeric'})}.`]);
    if(p.away && !p.open) n.push(['Away', `${p.name}: ${p.away.toLowerCase()}.`]);
  });
  const hiring=Object.entries(STAFF).filter(([,p])=>p.open && p.interview && now.date<=p.interview);
  if(hiring.length){
    const what=hiring.map(([id,p])=>{
      const where=Object.entries(ORG.programs).filter(([,pg])=>[...pg.dispatchers,...pg.support].includes(id)).map(([pid])=>PROGS[pid].short).join('/');
      return p.replaces ? `${STAFF[p.replaces].name}'s replacement (${where} support)` : `${(p.title||p.role).toLowerCase()} for ${where} (${schedOn(p,now.dow).replace(' - ','–')})`;
    });
    const day = hiring[0][1].interview===now.date ? 'today' : fmtDate(hiring[0][1].interview,{weekday:'long',month:'short',day:'numeric'});
    n.unshift([`Interviews ${day}`, what.join(' and ').replace(/^./,c=>c.toUpperCase())+'.']);
  }
  document.getElementById('notices').innerHTML=n.map(([h,t])=>`<div class="notice"><b>${h}</b>${t}</div>`).join('');
}
function renderCount(now){
  const ids=new Set(); Object.values(ORG.programs).forEach(pg=>[...pg.dispatchers,...pg.support,pg.lead].forEach(i=>ids.add(i)));
  ['sup',...ORG.afterHours,...ORG.dataSupport].forEach(i=>ids.add(i));
  const people=[...ids].map(i=>STAFF[i]).filter(p=>!p.open && active(p,now));
  document.getElementById('count').innerHTML=`<b>${people.filter(p=>onShift(p,now)).length}</b> of ${people.length} people on shift`;
}
function renderProgs(){
  document.getElementById('progs').innerHTML=[['all','All'],...Object.entries(PROGS).map(([k,v])=>[k,v.short])]
    .map(([k,l])=>`<button data-p="${k}" class="${prog===k?'on':''}">${l}</button>`).join('');
}

function render(){
  const now=pt();
  renderHeader(now); renderNotices(now); renderCount(now); renderProgs();
  if(view==='timeline'){ renderCards(now); renderTimeline(now); }
  if(view==='roster') renderRoster(now);
  if(view==='org') renderOrg(now);
}

/* ═══════════ ROLE DRAWER ═══════════ */
function openPerson(id){
  const p=STAFF[id]; if(!p) return; const def=ROLE_DEFS[p.role]; const now=pt();
  const list=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  const d=document.getElementById('drawer');
  d.innerHTML=`<button class="x" id="dx">Close</button>
    <h3>${displayName(p)}</h3>
    <p>${p.role}${p.location?` · ${p.location}`:''}</p>
    <h4>Hours (PT)</h4><p class="t">${typeof p.schedule==='string'?p.schedule:weekLabel(p)}</p>
    ${p.note?`<p>${p.note}</p>`:''}
    ${p.endDate?`<p><b>Last day: ${fmtDate(p.endDate,{weekday:'long',month:'long',day:'numeric'})}</b></p>`:''}
    ${p.open?`<p><b>${openNote(p,now)}</b></p>`:''}
    ${p.away?`<p><b>${p.away}</b></p>`:''}
    ${def?`<h4>What the role is for</h4><p>${def.purpose}</p><h4>Day to day</h4>${list(def.duties)}<h4>Owns</h4>${list(def.owns)}<h4>Measured by</h4>${list(def.measured)}`:''}`;
  d.classList.add('open'); d.setAttribute('aria-hidden','false');
  document.getElementById('dx').onclick=closePerson;
}
function closePerson(){ const d=document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); }

/* ═══════════ EVENTS ═══════════ */
function setView(v){
  view=v; store.set('view',v);
  ['timeline','roster','org'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelector('.bar').classList.toggle('hidden',v==='org');
  render();
}
function setTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('themeBtn').textContent = dark ? 'Light' : 'Dark';
}
document.getElementById('views').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.v); });
document.getElementById('progs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ prog=b.dataset.p; render(); } });
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim(); render(); });
document.getElementById('onlyOn').addEventListener('change',e=>{ onlyOn=e.target.checked; render(); });
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-id]'); if(n){ openPerson(n.dataset.id); return; }
  if(!e.target.closest('#drawer')) closePerson();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePerson(); });
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark = document.getElementById('themeBtn').textContent==='Dark';
  const t = dark ? 'dark' : 'light'; store.set('theme',t); setTheme(t);
});

/* ═══════════ INIT ═══════════ */
setTheme(store.get('theme'));
setView(['timeline','roster','org'].includes(store.get('view')) ? store.get('view') : 'timeline');
setInterval(render,30000);
</script>
</body>
